image:
  repository: gitlab-registry.cern.ch/cmcrobotics/intelligence-machine/aframe-scene
  pullPolicy: IfNotPresent
  tag: "latest"


domain: inmachine.app.cern.ch

route:
  enabled: true
  
config:
  mqttBrokerUrl: "wss://inmachine-mqtt.app.cern.ch" 

mosquitto:
  enabled: true
  wsDomain: "inmachine-mqtt.app.cern.ch" # If empty, will default to mqtt-{{ .Values.domain }}
  image:
    repository: eclipse-mosquitto
    tag: 2.0.18
  service:
    type: ClusterIP
    wsPort: 9001
    mqttPort: 1883

ingress:
  enabled: false
