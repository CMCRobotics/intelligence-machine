<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brain Lab</title>
    <script  defer src="aframe.bundle.js"></script>
</head>
<body>
    <a-scene id="aframe-scene" light="defaultLightsEnabled: false"
             sound="src: #forestAmbientSound; loop: true; volume: 0.1; autoplay: false">
        <a-assets>
            <!-- https://cmc-cdn.web.cern.ch/assets/intelligence-machine/ -->
            <a-asset-item id="floor"               src="assets/floor.glb"  ></a-asset-item>
            <a-asset-item id="base"                src="assets/base.glb"  ></a-asset-item>
            <a-asset-item id="dome"                src="assets/dome.glb"  ></a-asset-item>
            <a-asset-item id="cyberbrain"          src="assets/cyberbrain.glb"  ></a-asset-item>
            <a-asset-item id="lab-device"          src="assets/lab-device.glb"  ></a-asset-item>
            <a-asset-item id="lab-device-2"        src="assets/lab-device-2.glb"  ></a-asset-item>
            <a-asset-item id="lab-chair"        src="assets/lab-chair.glb"  ></a-asset-item>
            <a-asset-item id="lab-desk"        src="assets/lab-desk.glb"  ></a-asset-item>
            <a-asset-item id="lab-computer"        src="assets/lab-computer.glb"  ></a-asset-item>
            
            <!-- New Sound Assets -->
            <a-asset-item id="forestAmbientSound" src="assets/forest-ambient.mp3" response-type="arraybuffer"></a-asset-item>
        </a-assets>

        <a-entity environment="preset: forest; dressing: trees; dressingAmount: 100; dressingColor: #ceebd5; dressingScale: 15; fog: 0.6; fogColor: #adc2d6; playArea: 30; shadow: true; horizonsColor: #b1d1f0; skyColor: #88c0f4; stageSize: 200; lighting: none; "></a-entity>
        <a-entity light="intensity: 0.4; type: ambient" position="-1.17106 1.00163 2.32528"></a-entity>
        <a-entity light="decay: -2.96; intensity: 0.04; type: spot; castShadow: true; shadowCameraFov: 75.97; shadowCameraNear: 0.78; shadowCameraBottom: -4.24; shadowMapWidth: 512.27" position="-85.94564 27.28891 10.22902" rotation="0 -44.67065449737463 0"></a-entity>
        
        <a-entity load-fragment="src: /scene-lab.html; templateId: scene-lab"></a-entity>
    
        <!-- Default A-Frame Camera (no explicit camera entity needed for default VR POV) -->
        <!-- The sound component is now on the a-scene element -->
        <!-- <a-entity id="main-camera" camera orbit-controls="zoomSpeed: 1.5; minDistance: 3; maxDistance: 9; initialPosition: 0 6 12; maxPolarAngle: 80; rotateSpeed: 2" position="0 1.6 0"></a-entity> -->
    </a-scene>

    <div id="play-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.8); display: flex; justify-content: center; align-items: center; z-index: 9999;">
        <button id="play-button" style="padding: 20px 40px; font-size: 24px; cursor: pointer;">Enter the lab</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const playButton = document.getElementById('play-button');
            const playOverlay = document.getElementById('play-overlay');
            const ambientSoundEntity = document.getElementById('aframe-scene'); // Reference the a-scene entity

            playButton.addEventListener('click', function () {
                // Resume AudioContext (if suspended)
                if (AFRAME.utils.device.get  && AFRAME.utils.device.get().audioContext) {
                    AFRAME.utils.device.get().audioContext.resume();
                }
                
                // Start playing the ambient sound
                if (ambientSoundEntity && ambientSoundEntity.components.sound) {
                    ambientSoundEntity.components.sound.playSound();
                }

                // Hide the overlay
                playOverlay.style.display = 'none';
            });
        });
    </script>
</body>
</html>
